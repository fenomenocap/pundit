name: CI

on:
  pull_request:
  # Also run on main. With pull_request alone, anything merged or pushed
  # directly went untested, so a break on main first surfaced on the next
  # unrelated pull request instead of when it landed.
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        working-directory: packages/api
        run: npx tsc --noEmit

      - name: Type-check web
        working-directory: packages/web
        run: npx tsc --noEmit

      - name: Test API
        run: pnpm --filter @sports-predict/api test

      # The chat-eval harness lives in root scripts/, so pnpm -r test never
      # reached it and its guards could rot unnoticed. Both commands are local:
      # no production traffic and no Anthropic credits.
      - name: Test chat-eval harness
        run: pnpm chat-eval:test

      - name: Validate chat-eval scenarios
        run: pnpm chat-eval:dry-run

      - name: Test Vercel ignored-build policy
        run: pnpm test:vercel-ignore

      - name: Build web
        run: pnpm --filter @sports-predict/web build

      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke
        working-directory: packages/web
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
        run: pnpm test:e2e

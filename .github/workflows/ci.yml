name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        working-directory: packages/api
        run: npx tsc --noEmit

      - name: Type-check web
        working-directory: packages/web
        run: npx tsc --noEmit

      - name: Test API
        run: pnpm --filter @sports-predict/api test

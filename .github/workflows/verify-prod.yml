name: Verify Production

on:
  workflow_run:
    workflows: ["Deploy API (DigitalOcean)"]
    types: [completed]
  workflow_dispatch:

# Main can receive several pushes in minutes. Railway deploys only the newest
# API rebuild and often leaves intermediate SHAs stuck at pending GitHub status,
# which made parallel Verify Production runs false-fail after the 15-minute wait.
concurrency:
  group: verify-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deployed web SHA
        id: web-sha
        shell: bash
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          sha=$(bash scripts/resolve-deployed-sha.sh web)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve deployed API SHA
        id: api-sha
        shell: bash
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          sha=$(bash scripts/resolve-deployed-sha.sh api)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify production
        env:
          PUNDIT_API_URL: ${{ vars.PUNDIT_API_URL }}
          PUNDIT_EXPECTED_API_HOST: ${{ vars.PUNDIT_EXPECTED_API_HOST }}
          PUNDIT_EXPECT_FIXTURE_REGISTRY: ${{ vars.PUNDIT_EXPECT_FIXTURE_REGISTRY }}
          PUNDIT_VERIFY_WAIT_SECONDS: ${{ vars.PUNDIT_VERIFY_WAIT_SECONDS }}
        run: bash scripts/verify-prod.sh "${{ steps.api-sha.outputs.sha }}" "${{ steps.web-sha.outputs.sha }}"

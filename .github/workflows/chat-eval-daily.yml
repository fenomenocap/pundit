name: Daily Chat Eval

# Two jobs share one schedule:
#   gate  — deterministic monitor assertions against pinned fixture + replayed
#           web-search recordings (hard fail when regressions land).
#   sweep — live production battle test for monitoring only (never fails the
#           workflow; findings live in the summary and chat-eval-data branch).

on:
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch:
    inputs:
      engine:
        description: Live sweep engine mode (both = legacy certification + agent report)
        type: choice
        options:
          - both
          - legacy
          - agent
        default: both

permissions:
  contents: write
  actions: read

concurrency:
  group: chat-eval-daily
  cancel-in-progress: false

env:
  DATA_BRANCH: chat-eval-data
  EVAL_DIR: artifacts/chat-evals

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pinned monitor gate
        run: pnpm chat-eval:gate

  sweep:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore previous run for regression comparison
        run: |
          mkdir -p "$EVAL_DIR"
          if git fetch origin "$DATA_BRANCH" 2>/dev/null; then
            git show "origin/$DATA_BRANCH:latest.json" > "$EVAL_DIR/latest.json" 2>/dev/null \
              || rm -f "$EVAL_DIR/latest.json"
          fi
          ls -la "$EVAL_DIR"

      - name: Resolve deployed source SHA
        id: sha
        run: |
          git fetch origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Resolve sweep engine mode
        id: engine
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.engine || 'both' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run production chat battle test (legacy)
        id: sweep_legacy
        if: steps.engine.outputs.mode == 'both' || steps.engine.outputs.mode == 'legacy'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          node scripts/chat-battle-test.mjs --source-sha "${{ steps.sha.outputs.sha }}" --engine legacy \
            --output-dir "$EVAL_DIR/legacy" 2>&1 | tee sweep-legacy.log

      - name: Run production chat battle test (agent, non-gating)
        id: sweep_agent
        if: steps.engine.outputs.mode == 'both' || steps.engine.outputs.mode == 'agent'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          node scripts/chat-battle-test.mjs --source-sha "${{ steps.sha.outputs.sha }}" --engine agent --non-gating \
            --output-dir "$EVAL_DIR/agent" 2>&1 | tee sweep-agent.log

      - name: Merge dual-engine eval report
        if: steps.engine.outputs.mode == 'both'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/merge-dual-engine-chat-eval.mjs \
            "$EVAL_DIR/legacy/latest-run.json" \
            "$EVAL_DIR/agent/latest-run.json" \
            "$EVAL_DIR/latest-run.json"
          cp sweep-legacy.log sweep.log
          tail -n 40 sweep-agent.log >> sweep.log

      - name: Promote single-engine sweep report
        if: steps.engine.outputs.mode != 'both'
        run: |
          SRC="$EVAL_DIR/${{ steps.engine.outputs.mode }}/latest-run.json"
          cp "$SRC" "$EVAL_DIR/latest-run.json"
          cp "sweep-${{ steps.engine.outputs.mode }}.log" sweep.log

      - name: Render transcript and summary
        id: render
        run: |
          RUN_DATE=$(date -u +%F)
          echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          if [ -f "$EVAL_DIR/latest-run.json" ]; then
            node scripts/render-chat-transcript.mjs "$EVAL_DIR/latest-run.json" transcript.md summary.json "$RUN_DATE"
          else
            REASON=$(grep -m1 "chat battle test failed" sweep.log || tail -n 1 sweep.log)
            node -e '
              const [date, reason] = process.argv.slice(1);
              const summary = { date, status: "attention", progress: "preflight-failed", scenariosRun: 0,
                passed: 0, failed: 0, findings: [{ scenario: "preflight", summary: reason }] };
              require("fs").writeFileSync("summary.json", JSON.stringify(summary, null, 2) + "\n");
              require("fs").writeFileSync("transcript.md", `# Pundit chat transcript — ${date}\n\nPreflight failed before any scenario ran:\n\n> ${reason}\n`);
            ' "$RUN_DATE" "$REASON"
          fi
          head -n 12 transcript.md >> "$GITHUB_STEP_SUMMARY"
          echo "## Live sweep (report only)" >> "$GITHUB_STEP_SUMMARY"
          node -p '"Status: " + require("./summary.json").status + " · progress: " + require("./summary.json").progress' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: chat-eval-${{ steps.render.outputs.date }}-${{ github.run_id }}
          path: |
            ${{ env.EVAL_DIR }}/*.json
            ${{ env.EVAL_DIR }}/*.md
            ${{ env.EVAL_DIR }}/legacy/**
            ${{ env.EVAL_DIR }}/agent/**
            sweep.log
            transcript.md
            summary.json
          retention-days: 90

      - name: Commit transcript to data branch
        env:
          RUN_DATE: ${{ steps.render.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE=$(mktemp -d)
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch origin "$DATA_BRANCH"
            git worktree add "$WORKTREE" "origin/$DATA_BRANCH"
            git -C "$WORKTREE" checkout -B "$DATA_BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan "$DATA_BRANCH"
            git -C "$WORKTREE" rm -rf --quiet .
            printf '# Pundit daily chat eval data\n\nWritten by `.github/workflows/chat-eval-daily.yml`. One folder per UTC day under `runs/`.\n\n' > "$WORKTREE/README.md"
          fi
          DEST="$WORKTREE/runs/$RUN_DATE"
          mkdir -p "$DEST"
          cp transcript.md summary.json sweep.log "$DEST/"
          if [ "$(node -p 'require("./summary.json").progress')" = "complete" ]; then
            cp "$EVAL_DIR/latest.json" "$WORKTREE/latest.json"
            cp "$EVAL_DIR/latest.md" "$DEST/report.md"
          fi
          cp summary.json "$WORKTREE/latest-summary.json"
          cd "$WORKTREE"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "chat eval $RUN_DATE ($(node -p 'require("./latest-summary.json").status'))"
          for attempt in 1 2 3 4; do
            git push origin "$DATA_BRANCH" && exit 0
            sleep $((2 ** attempt))
            git pull --rebase origin "$DATA_BRANCH" || true
          done
          exit 1

      - name: Live sweep report (never fails the job)
        if: always()
        run: |
          STATUS=$(node -p 'require("./summary.json").status')
          echo "Live sweep status: $STATUS (harness step: ${{ steps.sweep.outcome }})"
          echo "This job is report-only; see gate job for hard pass/fail."
          if [ "$STATUS" != "clean" ] || [ "${{ steps.sweep.outcome }}" = "failure" ]; then
            echo "Transcript: $DATA_BRANCH:runs/${{ steps.render.outputs.date }}/transcript.md"
          fi

# Pundit API on the DigitalOcean droplet (degen-dev, 134.209.121.101).
# Layout on the server:
#   /opt/pundit          git clone of fenomenocap/pundit (main)
#   /opt/pundit/.env.api secrets + flags (chmod 600, gitignored by .env.*)
#   /opt/pundit-deploy   this bundle (docker-compose.yml, Dockerfile, Caddyfile)
#   /opt/pundit-data     persistent PUNDIT_DATA_DIR (was Railway /data)
#   /opt/pundit-deploy/caddy  Caddyfile + upstream.caddy (mounted as a directory)
#
# Canonical copy: deploy/do/docker-compose.yml in fenomenocap/pundit.
# Deploys: /opt/pundit-deploy/deploy.sh <sha>  (health-gated blue/green, see
# deploy/do/README.md). Do NOT `docker compose up -d --build api` any more:
# the API runs as pundit-api-blue / pundit-api-green (projects pundit-blue /
# pundit-green, generated by deploy/do/swap.sh from the `api` service below).
# The `api` service is behind the "legacy" profile so a plain
# `docker compose up -d` (e.g. for Caddy) never starts a second API.

name: pundit

services:
  api:
    profiles: ["legacy"]
    build:
      context: /opt/pundit
      dockerfile: /opt/pundit-deploy/Dockerfile
    image: pundit-api:local
    restart: unless-stopped
    env_file:
      - /opt/pundit/.env.api
    environment:
      # Fixed by this deployment; override nothing here in .env.api.
      PORT: "3001"
      PUNDIT_DATA_DIR: /data
      BUILD_SHA: ${BUILD_SHA:-unknown}
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - /opt/pundit-data:/data
    # Loopback only: reachable from the droplet itself (curl) and from Caddy over
    # the compose network. Docker-published ports bypass ufw, so never 0.0.0.0.
    # swap.sh overrides this per colour: blue 127.0.0.1:3101, green 127.0.0.1:3102.
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 1g
    memswap_limit: 1536m
    stop_grace_period: 25s   # matches Railway drainingSeconds=20 + margin
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A directory, not a single file: swap.sh replaces upstream.caddy with an
      # atomic rename, which a single-file bind mount would never see.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data      # certificates: keep this volume
      - caddy_config:/config
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:

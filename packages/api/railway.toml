# Compatibility copy of the root Railway config for the Railway service @pundit/api.
# (the pnpm package it builds is still named @sports-predict/api)
# In the Railway service settings, set "Config file path" to:
#   /packages/api/railway.toml
# only if Railway is explicitly configured to use this nested path. The
# repository-root railway.toml is canonical for the current root-linked service.

[build]
builder = "RAILPACK"
buildCommand = "corepack enable && pnpm --filter @sports-predict/api build"
watchPatterns = [
  "/packages/api/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/.node-version",
  "/.nvmrc",
]

[deploy]
# Run Node as PID1, not pnpm. On rolling deploys Railway SIGTERMs the old
# container; pnpm exits non-zero (ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL) and
# triggers false "Deploy Crashed!" emails even when the new deploy is healthy.
startCommand = "node packages/api/dist/index.js"
# Give the old instance time to drain in-flight requests after SIGTERM before
# SIGKILL. Matches packages/api graceful shutdown in src/index.ts.
drainingSeconds = 20
healthcheckPath = "/startup"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
